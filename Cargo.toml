[workspace]
resolver = "2"
members = ["crates/octl-core", "crates/octl-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Jari Mustonen"]
repository = "https://github.com/jarimustonen/orchestratectl"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
fs4 = { version = "1", default-features = false, features = ["sync"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
insta = { version = "1", features = ["json", "filters"] }
assert_cmd = "2"
predicates = "3"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
ctrlc = { version = "3.4", features = ["termination"] }
sha2 = "0.10"
libc = "0.2"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[profile.release]
lto = "thin"
codegen-units = 1
