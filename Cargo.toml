[workspace]
resolver = "2"
members = ["crates/octl-core", "crates/octl-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Jari Mustonen"]
repository = "https://github.com/jarimustonen/orchestratectl"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
fs2 = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
