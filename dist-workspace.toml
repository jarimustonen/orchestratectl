[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.2"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Homebrew tap repository for the auto-generated formula.
# Per-tool tap convention (matches homebrew-ossctl / homebrew-issuectl):
# repo `homebrew-orchestratectl` → `brew install jarimustonen/orchestratectl/orchestratectl`.
tap = "jarimustonen/homebrew-orchestratectl"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# orchestratectl is tmux + git-worktree centric — POSIX-only by design.
# Windows is intentionally NOT a target; the supervisor uses fork(2),
# setsid(2), sigaction(2), and unix signal handlers throughout.
#
# x86_64-apple-darwin is intentionally NOT built: the only always-on macOS
# release runner is `hauis` (Apple Silicon, Homebrew Rust = no rustup / no
# x86_64 std), so it cannot cross-compile the Intel target. Apple Silicon is
# fully covered; Intel-Mac users install from source via `cargo install`.
# Revisit if/when a rustup toolchain is added to the release runner.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"

# Route the macOS build to the self-hosted `hauis` runner. GitHub-hosted
# macOS minutes are effectively unavailable on the Free plan (multi-hour
# queues); the two Linux targets stay on GitHub-hosted ubuntu runners.
#
# GOTCHA (fixed 2026-08-04): do NOT set `GIT_CONFIG_GLOBAL` in the `hauis`
# runner's `~/actions-runner/.env`. `actions/checkout@v4` overrides HOME and
# reads `$HOME/.gitconfig`, but git honors `GIT_CONFIG_GLOBAL` and writes the
# auth token elsewhere → checkout fails with "Unable to replace auth
# placeholder in .../.gitconfig", failing the mac build (and cascading to skip
# host/publish-homebrew). Leave the runner's global git config at the default
# `$HOME/.gitconfig` (a dotfiles symlink there is fine). See issue
# `release-mac-checkout-git-config-global`.
[dist.github-custom-runners]
aarch64-apple-darwin = "self-hosted"
