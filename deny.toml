# cargo-deny configuration for Taskfleet.
#
# Scope (per issue ci-and-lints): licenses + advisories + bans. The `sources`
# check is intentionally left at defaults for now — we only pull from crates.io.
# Run locally with `cargo deny check`.

[advisories]
# Opt into the modern (v2) advisories schema explicitly so behaviour is stable
# regardless of which cargo-deny version the CI action pulls.
version = 2
# Fail on any crate with an active RUSTSEC advisory or that has been yanked.
yanked = "deny"
# Scope of the unmaintained check ("all" = the whole dependency tree, not just
# our own crates). In the v2 schema unmaintained is a fail-by-default advisory
# class scoped here, not a warn/deny severity knob.
unmaintained = "all"
# Same scoping for unsound advisories ("all" = fail on an unsound RUSTSEC entry
# anywhere in the tree). General defense-in-depth: verified that `unmaintained =
# "all"` emits `error[unmaintained]` and fails the check (exit 1) on a flagged
# crate, so this is a hard gate, not a warning. Note this does NOT cover fs2 —
# fs2 has no RUSTSEC advisory of any class in the database today, so the [bans]
# entry below (not these advisory gates) is what actually guards against it.
unsound = "all"
# NOTE: the old v1 `vulnerability`/`notice` knobs were removed in the v2 schema
# (EmbarkStudios/cargo-deny#611). Vulnerability advisories now always fail — there
# is no warn/deny toggle — so RUSTSEC vulnerabilities are denied by default here.
#
# Scoped, time-boxed advisory ignores. Each entry names ONE RUSTSEC id with a
# justification and a review-by trigger. Never blanket-ignore a class here.
ignore = [
    # RUSTSEC-2026-0009 — `time`: DoS via stack exhaustion while PARSING a
    # crafted duration/format string. `time` is a purely transitive dep pulled
    # ONLY by tracing-appender (log-file rotation timestamps); we never parse
    # untrusted/attacker-controlled time input, so the advisory is not
    # exploitable in our usage. The fixed `time` range (>=0.3.47) declares
    # rust-version = 1.88, which exceeds this project's MSRV floor of 1.85
    # (Cargo.toml rust-version = "1.85", enforced by the `msrv (1.85)` CI job).
    # Bumping `time` to clear the advisory therefore breaks MSRV — the two are
    # mutually exclusive for `time` today. We pin `time` under the 1.85 floor
    # (0.3.41) and ignore the advisory instead.
    # REVIEW-BY: re-evaluate when this project's MSRV moves to >= 1.88 (then drop
    # this ignore and bump `time` to the fixed range).
    "RUSTSEC-2026-0009",
]

[licenses]
version = 2
# Allow-list of licenses acceptable for this MIT-licensed project. Anything
# outside this set (notably the copyleft GPL/AGPL family) fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Require ≥ this confidence when inferring a license from crate text.
confidence-threshold = 0.8

[bans]
# Surface duplicate semver-incompatible versions of the same crate as a warning
# (keeps the dependency graph lean without hard-failing on transitive dupes).
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden — pin to a real range.
wildcards = "deny"
# …except internal path deps (e.g. taskfleet -> taskfleet-core), which carry no
# version requirement by design and are never published to a registry.
allow-wildcard-paths = true
# Reintroduction guard: fs2 was dropped (issue replace-fs2-with-fs4) because it is
# unmaintained with known soundness issues. IMPORTANT — fs2 has no RUSTSEC advisory
# in the database today (no entry under crates/fs2/), so the `unmaintained`/`unsound`
# advisory gates above do NOT catch it. This name-based ban is the *sole* guard: it
# fails CI the moment fs2 reappears in the tree — directly or transitively, at any
# version — independent of advisory-database state. (A `package = "fs2"` rename is
# still caught, since cargo-deny matches the resolved crate name in the lockfile; a
# fork published under a different name would not be — accepted limitation.)
deny = [{ crate = "fs2", reason = "unmaintained with known soundness issues; replaced by fs4 (issue replace-fs2-with-fs4). Do not reintroduce." }]

[sources]
# Defaults: crates.io is the only allowed registry; no git sources configured.
unknown-registry = "deny"
unknown-git = "deny"
