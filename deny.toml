# cargo-deny configuration for orchestratectl.
#
# Scope (per issue ci-and-lints): licenses + advisories + bans. The `sources`
# check is intentionally left at defaults for now — we only pull from crates.io.
# Run locally with `cargo deny check`.

[advisories]
# Opt into the modern (v2) advisories schema explicitly so behaviour is stable
# regardless of which cargo-deny version the CI action pulls.
version = 2
# Fail on any crate with an active RUSTSEC advisory or that has been yanked.
yanked = "deny"
# Scope of the unmaintained check ("all" = the whole dependency tree, not just
# our own crates). In the v2 schema unmaintained is a fail-by-default advisory
# class scoped here, not a warn/deny severity knob.
unmaintained = "all"
# Same scoping for unsound advisories ("all" = fail on an unsound RUSTSEC entry
# anywhere in the tree). This is the class fs2 was flagged under, so it is set
# explicitly rather than relying on the schema default.
unsound = "all"
# NOTE: the old v1 `vulnerability`/`notice` knobs were removed in the v2 schema
# (EmbarkStudios/cargo-deny#611). Vulnerability advisories now always fail — there
# is no warn/deny toggle — so RUSTSEC vulnerabilities are denied by default here.

[licenses]
version = 2
# Allow-list of licenses acceptable for this MIT-licensed project. Anything
# outside this set (notably the copyleft GPL/AGPL family) fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Require ≥ this confidence when inferring a license from crate text.
confidence-threshold = 0.8

[bans]
# Surface duplicate semver-incompatible versions of the same crate as a warning
# (keeps the dependency graph lean without hard-failing on transitive dupes).
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden — pin to a real range.
wildcards = "deny"
# …except internal path deps (e.g. octl-cli -> octl-core), which carry no
# version requirement by design and are never published to a registry.
allow-wildcard-paths = true
# Reintroduction guard: fs2 was dropped (issue replace-fs2-with-fs4) because it is
# unmaintained with a known soundness advisory. The `unmaintained`/`unsound`
# advisory gates above already block it, but those depend on RUSTSEC keeping the
# entry live. This hard ban fails CI the moment fs2 reappears in the tree — even
# transitively via some other crate — independent of advisory-database state.
deny = [{ crate = "fs2", reason = "unmaintained + unsound; replaced by fs4 (issue replace-fs2-with-fs4). Do not reintroduce." }]

[sources]
# Defaults: crates.io is the only allowed registry; no git sources configured.
unknown-registry = "deny"
unknown-git = "deny"
