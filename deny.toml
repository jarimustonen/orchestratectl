# cargo-deny configuration for orchestratectl.
#
# Scope (per issue ci-and-lints): licenses + advisories + bans. The `sources`
# check is intentionally left at defaults for now — we only pull from crates.io.
# Run locally with `cargo deny check`.

[advisories]
# Fail on any crate with an active RUSTSEC advisory or that has been yanked.
yanked = "deny"
# Unmaintained/unsound advisories are warnings until we decide to act on them.
unmaintained = "workspace"

[licenses]
# Allow-list of licenses acceptable for this MIT-licensed project. Anything
# outside this set (notably the copyleft GPL/AGPL family) fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Require ≥ this confidence when inferring a license from crate text.
confidence-threshold = 0.8

[bans]
# Surface duplicate semver-incompatible versions of the same crate as a warning
# (keeps the dependency graph lean without hard-failing on transitive dupes).
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden — pin to a real range.
wildcards = "deny"
# …except internal path deps (e.g. octl-cli -> octl-core), which carry no
# version requirement by design and are never published to a registry.
allow-wildcard-paths = true

[sources]
# Defaults: crates.io is the only allowed registry; no git sources configured.
unknown-registry = "deny"
unknown-git = "deny"
