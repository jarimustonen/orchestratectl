name: Publish to crates.io

# The version tag also starts cargo-dist's independent release.yml. Neither
# workflow waits for the other. This workflow owns only the ordered crates.io
# saga and never publishes on workflow_dispatch.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-version:
    name: release topology and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact five-leg topology, pins, repository, and tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{print $2;exit}' Cargo.toml)"
          test "$GITHUB_REF_TYPE" != tag || test "$GITHUB_REF_NAME" = "v$version"
          jq -e '
            .schema_version == 1 and (.activation == "blocked-r7" or .activation == "ready") and
            .repository == "jarimustonen/orchestratectl" and
            [.crates_io.legs[] | .package] == ["taskfleet-core","taskfleet","orchestratectl"] and
            [.crates_io.legs[] | .depends_on] == [null,"taskfleet-core","taskfleet"] and
            [.distribution[] | (.package+":"+.registry+":"+.workflow)] ==
              ["taskfleet:gh-releases:release.yml","taskfleet:homebrew:release.yml"]
          ' release/taskfleet-release.json >/dev/null
          if test "$GITHUB_REF_TYPE" = tag; then
            jq -e '.activation == "ready"' release/taskfleet-release.json >/dev/null || {
              echo "release activation is blocked; refusing tag-triggered crates.io publication" >&2
              exit 1
            }
          fi
          test "$(sed -nE 's/^taskfleet-core = \{[^}]*version = "=([^"]+)".*/\1/p' crates/taskfleet/Cargo.toml)" = "$version"
          test "$(sed -nE 's/^taskfleet = \{[^}]*version = "=([^"]+)".*/\1/p' compat/orchestratectl/Cargo.toml)" = "$version"
          cargo metadata --locked --no-deps --format-version 1 | jq -e --arg version "$version" '
            [.packages[] | .name] | sort == ["orchestratectl","taskfleet","taskfleet-core"] and
            all(.packages[]; .version == $version and .repository == "https://github.com/jarimustonen/orchestratectl")
          ' >/dev/null

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - run: cargo fmt --all --check

  version-snapshots:
    name: version snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-version-snapshots.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: clippy}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --locked --release --workspace
      - run: cargo test --locked --release --workspace --doc

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  doc:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {RUSTDOCFLAGS: -D warnings}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --workspace --no-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  package-archives:
    name: sealed package archives
    needs: [release-version]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/publish-crates.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: taskfleet-package-archives
          path: target/package/*.crate

  publish-core:
    name: crates.io / taskfleet-core
    needs: [release-version, fmt, version-snapshots, clippy, test, msrv, doc, deny]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/publish-crates.sh publish taskfleet-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: crates-io-receipt-taskfleet-core
          path: target/release-receipts/*.json

  publish-taskfleet:
    name: crates.io / taskfleet
    needs: [publish-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/publish-crates.sh publish taskfleet
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: crates-io-receipt-taskfleet
          path: target/release-receipts/*.json

  publish-wrapper:
    name: crates.io / orchestratectl compatibility wrapper
    needs: [publish-taskfleet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/publish-crates.sh publish orchestratectl
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: crates-io-receipt-orchestratectl
          path: target/release-receipts/*.json
