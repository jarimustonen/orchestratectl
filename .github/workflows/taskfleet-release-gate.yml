name: Taskfleet release activation gate

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  verify-activation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Require completed Taskfleet release gates before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag || 'dry-run' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            echo "cargo-dist pull-request planning remains non-publishing"
            exit 0
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DISPATCH_TAG" == dry-run ]]; then
            echo "cargo-dist default dispatch remains non-publishing"
            exit 0
          fi
          # Fail closed for tag pushes and every future event type. cargo-dist's
          # host job accepts skipped build dependencies, so a rejected dispatch
          # also cancels the complete run before any downstream job is scheduled.
          if ! ./scripts/verify-release-activation.sh; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
            exit 2
          fi
